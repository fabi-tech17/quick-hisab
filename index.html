function calc(raw) {
  const s = norm(raw).replace(/[,\s৳]/g, ""); if (!s || !/^[0-9.+\-*/()]+$/.test(s)) return NaN;
  let i = 0;
  const E = () => { let v = M(); while (s[i] === "+" || s[i] === "-") { const o = s[i++], r = M(); v = o === "+" ? v + r : v - r; } return v; };
  const M = () => { let v = F(); while (s[i] === "*" || s[i] === "/") { const o = s[i++], r = F(); v = o === "*" ? v * r : v / r; } return v; };
  const F = () => { if (s[i] === "(") { i++; const v = E(); i++; return v; } const j = i; while (/[0-9.]/.test(s[i] || "")) i++; return parseFloat(s.slice(j, i)); };
  const v = E(); return i === s.length && isFinite(v) ? v : NaN;
}

function viewOwner(u) {
  S = { uid: u.uid, client: undefined, sub: undefined, cust: [], sales: [], tab: "sale", mode: "quick", sel: null, ledger: null, led: { s: [], r: [] }, drawn: false, registering: S.registering };
  const col = c => collection(db, "clients", u.uid, c);
  const onErr = e => show(`<div class="card"><div class="msg">${esc(errMsg(e))}</div><button class="btn ghost" id="lo">${t("logout")}</button></div>`);
  unsubs.push(onSnapshot(doc(db, "clients", u.uid), d => { S.client = d.exists() ? d.data() : null; gate(); }, onErr));
  unsubs.push(onSnapshot(doc(db, "subscriptions", u.uid), d => { S.sub = d.exists() ? d.data() : null; gate(); }, onErr));
  unsubs.push(onSnapshot(col("customers"), q => { S.cust = q.docs.map(d => ({ id: d.id, ...d.data() })); S.pc = q.metadata.hasPendingWrites; refresh(); }, onErr));
  S.listen = () => {
    S.unSales && S.unSales(); S.day = todayStr();
    S.unSales = onSnapshot(query(col("sales"), where("date", "==", S.day)), q => { S.sales = q.docs.map(d => ({ id: d.id, ...d.data() })); S.ps = q.metadata.hasPendingWrites; refresh(); }, onErr);
  };
  S.listen();
  S.timer = setInterval(() => { if (S.day !== todayStr()) { S.listen(); refresh(); } }, 60000);
  unsubs.push(() => { stopLedger(); S.unSales && S.unSales(); clearInterval(S.timer); });
}
function gate() {
  if (S.client === undefined || S.sub === undefined) return show(loadingH());
  if (S.client === null) return S.registering ? show(loadingH()) : viewProfile();
  if (!S.drawn) { S.drawn = true; draw(); } else refresh();
}
function go(tab) {

}
function draw() { if (S.ledger) return drawLedger(); ({ sale: drawSale, cust: drawCust, set: drawSet })[S.tab](); }
function refresh() {
  if (!S.drawn) return;
  if (S.ledger) return fillLedger();

  else if (S.tab === "cust") { fillTop(); fillCustList(); } else fillSet();

function saveSale() {
  const err = m => { $("#m").textContent = m; };
  if (!canWrite()) return err(t("e_perm"));
  const total = r2(calc($("#am").value)); if (!(total > 0)) return err(t("bad_amt"));
  let cash = total, old = 0, cu = null;
  if (S.mode === "cust") {
    cu = S.cust.find(x => x.id === S.sel); if (!cu) return err(t("need_cust"));
    const cv = $("#cash").value.trim(), ov = $("#old")?.value.trim();
    cash = cv ? calc(cv) : 0; old = ov ? calc(ov) : 0;
    if (isNaN(cash) || isNaN(old) || cash < 0 || old < 0) return err(t("bad_amt"));
    if (cash > total) return err(t("cash_gt"));
    cash = r2(cash); old = r2(old);
  }
  err("");
  const due = r2(total - cash), date = todayStr(), uid = S.uid, b = writeBatch(db);
  const meta = { createdBy: uid, createdAt: serverTimestamp(), status: "active", date };
  const sref = newRef("sales"), sale = { ...meta, type: cu ? "customer" : "quick", total, cash, due, history: [] };
  if (cu) { sale.customerId = cu.id; sale.customerName = cu.name; }
  if (old > 0) {
    const rref = newRef("receipts"); sale.receiptId = rref.id; sale.oldCollected = old;
    b.set(rref, { ...meta, customerId: cu.id, customerName: cu.name, amount: old, fromSaleId: sref.id });
  }
  b.set(sref, sale);
  if (cu) b.update(cref("customers", cu.id), { balance: increment(r2(due - old)), lastTxnDate: date });
  b.set(cref("days", date), { salesTotal: increment(total), cashSales: increment(cash), receipts: increment(old) }, { merge: true });
  b.commit().catch(fail);
  if (cu) { const a = cu.balance, c = r2(a + due - old); toast(old > 0 ? t("ds2", { a: n(a), b: n(due), o: n(old), c: n(c) }) : t("ds1", { a: n(a), b: n(due), c: n(c) }), 6000); }

}

  const today = todayStr();
  const rows = [...S.led.s.map(x => ({ k: "s", x })), ...S.led.r.map(x => ({ k: "r", x }))].sort((a, b) => b.x.date.localeCompare(a.x.date) || ms(b.x) - ms(a.x));

    const right = k === "s" ? (x.due > 0 ? `<b class="neg">+${n(x.due)}</b>` : `<b>${n(x.total)}</b>`) : `<b class="pos">−${n(x.amount)}</b>`;
    const lbl = k === "s" ? (x.due > 0 ? `${t("sale_credit")} ৳${n(x.total)} · ${t("cash_got").replace(/ \(৳\)/, "")} ${n(x.cash)}` : `${t("sale_cash")} ৳${n(x.total)}`) : t("collected");
    return `<div class="row ${dead ? "x" : ""}"><div>${lbl}<div class="tag">${fmtD(x.date)}</div></div><div style="text-align:right">${right}${can ? `<div><button class="link" style="padding:2px 0" data-k="${k}" data-id="${x.id}">${t("cancel")}</button></div>` : ""}</div></div>`;
  }).join("") : `<div class="tag">${t("no_entries")}</div>`;
  $("#lt").querySelectorAll("[data-id]").forEach(b => b.onclick = () => b.dataset.k === "s" ? cancelSale(S.led.s.find(s => s.id === b.dataset.id)) : cancelReceipt(S.led.r.find(r => r.id === b.dataset.id)));
}
function reconcile(c) {
  const act = a => a.filter(x => x.status === "active");
  const sum = r2((c.opening || 0) + act(S.led.s).reduce((a, x) => a + x.due, 0) - act(S.led.r).reduce((a, x) => a + x.amount, 0));
  if (Math.abs(sum - c.balance) < 0.005) return toast(t("rec_ok"));
  updateDoc(cref("customers", c.id), { balance: sum }).then(() => toast(t("rec_fixed"))).catch(fail);
}

// ---------- মালিকের সেটিংস ----------
function drawSet() {
  const c = S.client;
  show(`<div class="card">${head()}<div class="row"><span>${t("status")}</span><span id="st"></span></div>
  <div class="row"><span>${t("plan")} / ${t("mode")}</span><b id="pm"></b></div><div class="row"><span>${t("expiry")}</span><b id="ex"></b></div></div>
  <div class="card"><b>${t("prof_t")}</b><label>${t("shop")}</label><input id="f1" value="${esc(c.shopName)}">
  <label>${t("owner")}</label><input id="f2" value="${esc(c.ownerName)}"><label>${t("phone")}${t("opt")}</label><input id="f3" inputmode="tel" value="${esc(c.phone)}">
  <div class="msg" id="m"></div><button class="btn" id="sp">${t("save")}</button></div>${langCard()}<button class="btn ghost" id="lo">${t("logout")}</button>`, navHtml(OT, "set"));
  bindLang(); fillSet();
  $("#sp").onclick = () => {
    const shopName = $("#f1").value.trim(), ownerName = $("#f2").value.trim(), phone = $("#f3").value.trim();
    if (!shopName || !ownerName) return $("#m").textContent = t("bad_name");
    updateDoc(doc(db, "clients", S.uid), { shopName, ownerName, phone }).then(() => { $("#m").className = "msg ok"; $("#m").textContent = t("saved"); }).catch(e => $("#m").textContent = errMsg(e));
  };
}
function fillSet() {
  if (!$("#st")) return;
  $("#st").innerHTML = statusBadge(S.sub); $("#pm").textContent = S.sub ? S.sub.plan + " / " + S.sub.mode : "—"; $("#ex").textContent = S.sub ? fmtDate(S.sub.expiresAt) : "—";
}

// ================= অ্যাডমিন =================
function viewAdmin() {
  A = { tab: "clients", c: [], s: {}, trial: DEFAULT_TRIAL_DAYS };
  const onErr = e => show(`<div class="card"><div class="msg">${esc(errMsg(e))}</div><button class="btn ghost" id="lo">${t("logout")}</button></div>`);
  const redraw = () => { if (A.tab === "clients") drawAdmin(); };
  unsubs.push(onSnapshot(collection(db, "clients"), q => { A.c = q.docs.map(d => ({ id: d.id, ...d.data() })); redraw(); }, onErr));
  unsubs.push(onSnapshot(collection(db, "subscriptions"), q => { A.s = {}; q.docs.forEach(d => A.s[d.id] = d.data()); redraw(); }, onErr));
  unsubs.push(onSnapshot(doc(db, "config", "app"), d => { A.trial = d.exists() && Number.isInteger(d.data().trialDays) ? d.data().trialDays : DEFAULT_TRIAL_DAYS; if (A.tab === "set" && document.activeElement?.id !== "td") drawAdmin(); }, onErr));
  drawAdmin();
}
function drawAdmin() {
  const nv = navHtml(AT, A.tab);
  if (A.tab === "clients") {
    show(`<div class="card"><h1>${t("tab_clients")}</h1><div class="brand">Quick Hisab by FaBi Hub</div><div class="sub">${t("clients_n", { n: n(A.c.length) })}</div>
    ${A.c.map(x => `<div class="row"><div><b>${esc(x.shopName)}</b><div class="tag">${contact(x)}</div></div>
    <div style="text-align:right">${statusBadge(A.s[x.id])}<div class="tag">${A.s[x.id] ? esc(A.s[x.id].plan) + " / " + esc(A.s[x.id].mode) : ""}</div></div></div>`).join("") || `<div class="tag">${t("no_clients")}</div>`}</div>`, nv);
    return;
  }
  show(`<div class="card"><h1>${t("tab_set")}</h1><div class="brand">Quick Hisab by FaBi Hub</div>
  <label>${t("trial_lbl")}</label><input id="td" inputmode="numeric" value="${A.trial}"><div class="msg ${A.ok ? "ok" : ""}" id="tm">${A.note || ""}</div>
  <button class="btn" id="ts">${t("save")}</button><div class="tag" style="margin-top:8px">${t("trial_note")}</div></div>${langCard()}
  <button class="btn ghost" id="lo">${t("logout")}</button>`, nv);
  bindLang(); A.note = "";
  $("#ts").onclick = async () => {
    const raw = norm($("#td").value).trim(), v = Number(raw);
    if (raw === "" || !Number.isInteger(v) || v < 0 || v > 365) { $("#tm").className = "msg"; $("#tm").textContent = t("trial_bad"); return; }
    try { await setDoc(doc(db, "config", "app"), { trialDays: v }, { merge: true }); A.trial = v; A.ok = true; A.note = t("saved"); } catch (e) { A.ok = false; A.note = errMsg(e); }
    drawAdmin();
  };
}

// ================= রোল দেখে রাউটিং =================
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = []; ROLE = null;
  if (!u) { viewAuth(); return; }
  show(loadingH());
  if (u.uid === ADMIN_UID) { ROLE = "admin"; viewAdmin(); } else { ROLE = "owner"; viewOwner(u); }
});
</script>
