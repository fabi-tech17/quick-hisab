html,body{margin:0;min-height:100%}
body{font-family:'Hind Siliguri',sans-serif;background:var(--paper);color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:16px 16px 84px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h1{font-size:22px;margin:0 0 2px;color:var(--maroon)}

.btn:active{opacity:.85}.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--maroon);border:1px solid var(--maroon)}
.btn.sm{min-height:40px;margin-top:0;font-size:14px}
.link{background:none;border:0;color:var(--maroon);font:inherit;text-decoration:underline;padding:10px 0;width:100%}
.msg{margin-top:10px;font-size:13px;color:var(--red);min-height:18px}
.msg.ok{color:var(--green)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:var(--green-bg);color:var(--green)}.b-warn{background:var(--gold-bg);color:#8a6a00}.b-bad{background:var(--red-bg);color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.center{text-align:center;padding-top:40vh;color:var(--soft)}
.neg{color:var(--red)}.pos{color:var(--green)}.x{text-decoration:line-through;opacity:.55}
.big{font-size:30px;font-weight:700;text-align:center;padding:10px 0 0}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;min-height:44px;border:1px solid var(--maroon);border-radius:10px;background:#fff;color:var(--maroon);font:inherit;font-weight:600}
.seg button.on{background:var(--maroon);color:#fff}
.pick{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;margin-top:6px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav:empty{display:none}
nav button{flex:1;min-height:58px;border:0;background:none;font:inherit;font-size:12px;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button b{font-size:20px;line-height:1}
nav button.on{color:var(--maroon);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2B2420;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;display:none;z-index:60;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;margin-left:4px;color:var(--maroon)}
.srow{display:flex;align-items:center;gap:8px;background:#F1E9D4;border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:14px}
.srow span{color:var(--soft);flex:0 0 auto}.srow b{flex:1;text-align:right;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh2{font-size:13px;font-weight:700;color:var(--maroon);margin:0 0 8px}
.dd{display:none;position:absolute;left:0;right:0;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.dd .pick{margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0}
</style>

const byName = (a, b) => a.name.localeCompare(b.name, "bn");

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const loadingH = () => `<div class="center">${t("loading")}</div>`;
const contact = c => [c.ownerName, c.phone].filter(Boolean).map(esc).join(" · ");
const OT = [["sale","৳","tab_sale"],["cust","👥","tab_cust"],["set","⚙️","tab_set"]];
const AT = [["clients","👥","tab_clients"],["set","⚙️","tab_set"]];
const navHtml = (tabs, cur) => tabs.map(([k, ic, l]) => `<button data-tab="${k}" class="${k === cur ? "on" : ""}"><b>${ic}</b>${t(l)}</button>`).join("");
const show = (h, nv = "") => {

const toast = (m, d = 3500) => { const e = $("#toast"); e.textContent = m; e.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = "none", d); };
const closeSheet = () => document.querySelector(".ov")?.remove();
const sheet = h => { closeSheet(); const o = document.createElement("div"); o.className = "ov"; o.innerHTML = `<div class="sh">${h}</div>`; o.onclick = e => { if (e.target === o) o.remove(); }; document.body.appendChild(o); return o; };
const EK = { "auth/invalid-credential":"e_cred","auth/invalid-email":"e_mail","auth/email-already-in-use":"e_used","auth/weak-password":"e_weak","auth/network-request-failed":"e_net","auth/too-many-requests":"e_many","permission-denied":"e_perm" };
const errMsg = e => EK[e.code] ? t(EK[e.code]) : t("e_gen") + ": " + (e.code || e.message);
const rerender = () => { if (ROLE === "admin") drawAdmin(); else if (ROLE === "owner" && S.drawn) draw(); };
function statusBadge(s) {
  if (!s) return `<span class="badge b-bad">${t("b_none")}</span>`;
  if (s.status !== "active") return `<span class="badge b-bad">${t("b_susp")}</span>`;
  const left = s.expiresAt.toMillis() - Date.now(), days = Math.ceil(left / 864e5);
  if (left <= -GRACE_DAYS * 864e5) return `<span class="badge b-bad">${t("b_over")}</span>`;
  if (left <= 0) return `<span class="badge b-warn">${t("b_grace")}</span>`;
  if (days <= RENEW_WARN_DAYS) return `<span class="badge b-warn">${t("b_warn", { n: n(days) })}</span>`;
  return `<span class="badge b-ok">${t("b_ok", { n: n(days) })}</span>`;
}

const canWrite = () => S.sub && S.sub.status === "active" && Date.now() < S.sub.expiresAt.toMillis() + GRACE_DAYS * 864e5;
const head = () => `<h1>${esc(S.client.shopName)}</h1><div class="brand">Quick Hisab by FaBi Hub</div>`;
const cref = (c, id) => doc(db, "clients", S.uid, c, id);
const newRef = c => doc(collection(db, "clients", S.uid, c));
const fail = e => toast(errMsg(e));

function viewOwner(u) {
  S = { uid: u.uid, client: undefined, sub: undefined, cust: [], sales: [], tab: "sale", mode: "quick", sel: null, sd: null, all: false, ledger: null, led: { s: [], r: [] }, drawn: false, registering: S.registering };
  const col = c => collection(db, "clients", u.uid, c);
  const onErr = e => show(`<div class="card"><div class="msg">${esc(errMsg(e))}</div><button class="btn ghost" id="lo">${t("logout")}</button></div>`);
  unsubs.push(onSnapshot(doc(db, "clients", u.uid), d => { S.client = d.exists() ? d.data() : null; gate(); }, onErr));
  unsubs.push(onSnapshot(doc(db, "subscriptions", u.uid), d => { S.sub = d.exists() ? d.data() : null; gate(); }, onErr));
  unsubs.push(onSnapshot(col("customers"), q => { S.cust = q.docs.map(d => ({ id: d.id, ...d.data() })); S.pc = q.metadata.hasPendingWrites; refresh(); }, onErr));
  S.listen = () => {
    S.unSales && S.unSales(); S.day = todayStr();
    S.unSales = onSnapshot(query(col("sales"), where("date", "==", curDate())), q => { S.sales = q.docs.map(d => ({ id: d.id, ...d.data() })); S.ps = q.metadata.hasPendingWrites; refresh(); }, onErr);
  };
  S.listen();
  S.timer = setInterval(() => { if (!S.sd && S.day !== todayStr()) { S.listen(); refresh(); } }, 60000);
  unsubs.push(() => { stopLedger(); S.unSales && S.unSales(); clearInterval(S.timer); });
}
function gate() {
  if (S.client === undefined || S.sub === undefined) return show(loadingH());
  if (S.client === null) return S.registering ? show(loadingH()) : viewProfile();
  if (!S.drawn) { S.drawn = true; draw(); } else refresh();
}
function go(tab) {
  if (ROLE === "admin") { A.tab = tab; drawAdmin(); return; }
  stopLedger(); S.tab = tab; S.ledger = null; draw();
}
function draw() { if (S.ledger) return drawLedger(); ({ sale: drawSale, cust: drawCust, set: drawSet })[S.tab](); }
function refresh() {
  if (!S.drawn) return;
  if (S.ledger) return fillLedger();
  if (S.tab === "sale") { fillTop(); fillSaleList(); fillCc(); fillPick(); }
  else if (S.tab === "cust") { fillTop(); fillCustList(); } else drawSet();
}
function banner() {
  const s = S.sub;
  if (s && s.status === "active" && Math.ceil((s.expiresAt.toMillis() - Date.now()) / 864e5) > RENEW_WARN_DAYS) return "";
  return `<div class="card" style="padding:10px">${statusBadge(s)}</div>`;
}
function fillTop() {
  const e = $("#bn"); if (!e) return;
  e.innerHTML = banner() + ((S.pc || S.ps) ? `<div class="card" style="padding:10px"><span class="badge b-warn">⏳ ${t("sync")}</span></div>` : "");
}

function askPassword() {
  return new Promise(res => {
    const o = sheet(`<b>${t("pw_confirm")}</b><div class="tag">${t("pw_why")}</div><input id="cpw" type="password" autocomplete="current-password" style="margin-top:10px"><div class="msg" id="cpm"></div>

  show(`<div id="bn"></div><div class="card">${head()}
  <div class="seg"><button id="m1">${t("quick")}</button><button id="m2">${t("pick_cust")}</button></div>

  setMode(S.mode); fillSaleList(); fillTop();

function setMode(m) {

  $("#al").textContent = t(m === "quick" ? "amount" : "total"); fillCx();

function fillCx() {

function fillCc() {

  <div class="row"><span>${t("cur_due")}</span><b class="${cu.balance > 0 ? "neg" : "pos"}">৳ ${n(cu.balance)}</b></div>
  ${cu.lastTxnDate ? `<div class="row"><span>${t("last_txn")}</span><span>${fmtD(cu.lastTxnDate)}</span></div>` : ""}`;

// ড্রপডাউন: শুধু টাইপ করলে মিলে যাওয়া কাস্টমার দেখায়, খালি থাকলে কিছুই না
function fillPick() {
  const l = $("#cl"); if (!l) return;
  const q = ($("#cq").value || "").trim().toLowerCase();
  if (!q) { l.style.display = "none"; l.innerHTML = ""; return; }
  const a = S.cust.filter(c => c.name.toLowerCase().includes(q) || (c.phone || "").includes(norm(q))).sort(byName).slice(0, 6);
  l.style.display = a.length ? "block" : "none";
  l.innerHTML = a.map(c => `<button class="pick" data-id="${c.id}">${esc(c.name)} <span class="tag">${esc(c.phone || "")}</span><span style="float:right" class="${c.balance > 0 ? "neg" : ""}">৳ ${n(c.balance)}</span></button>`).join("");
  l.querySelectorAll(".pick").forEach(b => b.onclick = () => { S.sel = b.dataset.id; fillCx(); });
}
function prev() {
  const e = $("#dp"); if (!e) return;
  const tot = calc($("#am")?.value || ""), cu = S.cust.find(x => x.id === S.sel);
  const cv = $("#cash")?.value.trim(), ov = $("#old")?.value.trim();
  const cash = cv ? calc(cv) : 0, old = ov ? calc(ov) : 0;
  if (!(tot > 0) || isNaN(cash) || isNaN(old)) { e.innerHTML = ""; return; }
  const due = r2(tot - cash);
  e.innerHTML = `<span>${t("due")}</span><b class="${due > 0 ? "neg" : ""}">৳ ${n(due)}</b>` +
    (cu && cu.creditLimit > 0 && cu.balance + due - old > cu.creditLimit ? `<div class="msg" style="flex-basis:100%;margin:0">${t("limit_over")} (${t("limit")} ৳ ${n(cu.creditLimit)})</div>` : "");
}
function saveSale() {
  const err = m => { $("#m").textContent = m; };
  if (!canWrite()) return err(t("e_perm"));
  const total = r2(calc($("#am").value)); if (!(total > 0)) return err(t("bad_amt"));
  let cash = total, old = 0, cu = null;
  if (S.mode === "cust") {
    cu = S.cust.find(x => x.id === S.sel); if (!cu) return err(t("need_cust"));
    const cv = $("#cash").value.trim(), ov = $("#old")?.value.trim();
    cash = cv ? calc(cv) : 0; old = ov ? calc(ov) : 0;
    if (isNaN(cash) || isNaN(old) || cash < 0 || old < 0) return err(t("bad_amt"));
    if (cash > total) return err(t("cash_gt"));
    cash = r2(cash); old = r2(old);
  }
  err("");
  const due = r2(total - cash), date = todayStr(), uid = S.uid, b = writeBatch(db);
  const meta = { createdBy: uid, createdByName: who(), createdAt: serverTimestamp(), status: "active", date };
  const sref = newRef("sales"), sale = { ...meta, type: cu ? "customer" : "quick", total, cash, due, note: $("#nt").value.trim(), history: [] };
  if (cu) { sale.customerId = cu.id; sale.customerName = cu.name; }
  if (old > 0) {
    const rref = newRef("receipts"); sale.receiptId = rref.id; sale.oldCollected = old;
    b.set(rref, { ...meta, customerId: cu.id, customerName: cu.name, amount: old, fromSaleId: sref.id });
  }
  b.set(sref, sale);
  if (cu) b.update(cref("customers", cu.id), { balance: increment(r2(due - old)), lastTxnDate: date });
  b.set(cref("days", date), { salesTotal: increment(total), cashSales: increment(cash), receipts: increment(old) }, { merge: true });
  b.commit().catch(fail);
  if (cu) { const a = cu.balance, c = r2(a + due - old); toast(old > 0 ? t("ds2", { a: n(a), b: n(due), o: n(old), c: n(c) }) : t("ds1", { a: n(a), b: n(due), c: n(c) }), 6000); }
  else toast(t("sale_ok") + " ৳ " + n(total));
  $("#am").value = ""; $("#nt").value = ""; S.sel = null; fillCx(); $("#am").focus();
}

// সিরিয়াল: ওই দিনের সব বিক্রি (বাতিলসহ) তৈরির সময় অনুযায়ী সাজিয়ে ১, ২, ৩…
function serials() { const m = {}; [...S.sales].sort((a, b) => ms(a) - ms(b)).forEach((s, i) => m[s.id] = i + 1); return m; }
function saleRow(s, sn) {

  return `<div class="row" style="align-items:flex-start"><div style="flex:1"><div class="${dead ? "x" : ""}"><b>${t("sell")}-${dg(sn)} = ${n(s.total)} (${nm})${s.due > 0 ? ` (${t("due")}-${n(s.due)})` : ""}</b>
  ${s.note ? `<div class="tag">📝 ${esc(s.note)}</div>` : ""}</div>
  <div class="tag">${tm(ms(s))}${s.editedByName ? ` · ✎ ${t("edited_by")}${esc(s.editedByName)}` : ""}</div>
  ${dead ? `<div class="tag neg">${t("cancel_by")}${esc(s.cancelledByName || "")}</div>` : ""}</div>
  ${dead ? "" : `<div style="white-space:nowrap"><button class="ib" data-e="${s.id}">✎</button><button class="ib" data-c="${s.id}" style="color:var(--red)">${t("cancel")}</button></div>`}</div>`;
}
function fillSaleList() {
  const l = $("#sl"); if (!l) return;
  const sn = serials(), all = [...S.sales].sort((a, b) => ms(b) - ms(a)), a = S.all ? all : all.slice(0, 10);
  l.innerHTML = (a.length ? a.map(s => saleRow(s, sn[s.id])).join("") : `<div class="tag" style="padding-top:6px">${t("no_sales")}</div>`) +
    `<button class="btn ghost sm" id="al2" style="width:100%;margin-top:8px">${t(S.all ? "less" : "all")}${S.all ? "" : " (" + dg(all.length) + ")"}</button>`;
  $("#al2").onclick = () => { S.all = !S.all; fillSaleList(); };
  l.querySelectorAll("[data-e]").forEach(b => b.onclick = () => editSale(S.sales.find(s => s.id === b.dataset.e)));
  l.querySelectorAll("[data-c]").forEach(b => b.onclick = () => cancelSale(S.sales.find(s => s.id === b.dataset.c)));
}
// এডিট = একই ডকুমেন্টে বদল (সিরিয়াল ও "Edited by" ঠিক থাকে); ক্যাশ/বাকি/দিনের যোগফল শুধু পার্থক্য ধরে ঠিক হয়
function editSale(s) {
  if (!s || s.status !== "active") return;
  const isC = s.type === "customer", old = s.oldCollected || 0, sn = serials()[s.id];
  const o = sheet(`<b>${t("edit_sale")}${sn ? " — " + t("sell") + "-" + dg(sn) : ""}</b>${isC ? `<div class="tag">${esc(s.customerName)}</div>` : ""}
  <label>${t("total")}</label><input id="e1" inputmode="decimal" value="${s.total}">
  ${isC ? `<label>${t("cash_got")}</label><input id="e2" inputmode="decimal" value="${s.cash}">` : ""}
  ${old > 0 ? `<div class="tag" style="margin-top:6px">${t("old_note", { o: n(old) })}</div>` : ""}
  <label>${t("note")}</label><input id="e3" value="${esc(s.note || "")}"><div class="msg" id="em2"></div><button class="btn" id="es" style="margin-top:6px">${t("save")}</button>`);
  const q = x => o.querySelector(x), err = m => { q("#em2").textContent = m; };
  q("#es").onclick = async () => {
    const total = r2(calc(q("#e1").value)); if (!(total > 0)) return err(t("bad_amt"));
    let cash = total;
    if (isC) { const v = q("#e2").value.trim(); cash = v ? calc(v) : 0; if (isNaN(cash) || cash < 0) return err(t("bad_amt")); if (cash > total) return err(t("cash_gt")); cash = r2(cash); }
    const note = q("#e3").value.trim();
    if (!canWrite()) return err(t("e_perm"));
    if (!(await askPassword())) return;
    const due = r2(total - cash), dT = r2(total - s.total), dC = r2(cash - s.cash), dD = r2(due - s.due), uid = S.uid, b = writeBatch(db);
    b.update(cref("sales", s.id), { total, cash, due, note, editedAt: serverTimestamp(), editedBy: uid, editedByName: who(),
      history: arrayUnion({ at: Date.now(), by: uid, n: who(), a: "edit", before: { total: s.total, cash: s.cash, due: s.due, note: s.note || "" } }) });
    if (s.customerId && dD) b.update(cref("customers", s.customerId), { balance: increment(dD) });
    if (dT || dC) b.set(cref("days", s.date), { salesTotal: increment(dT), cashSales: increment(dC) }, { merge: true });
    b.commit().catch(fail); toast(t("sale_edited"));
  };
}
function cancelSale(s) {
  if (!s || s.status !== "active" || !confirm(t("confirm_cancel"))) return;
  if (!canWrite()) return toast(t("e_perm"));
  const uid = S.uid, b = writeBatch(db), old = s.oldCollected || 0;
  const by = { status: "cancelled", cancelledAt: serverTimestamp(), cancelledBy: uid, cancelledByName: who() };
  b.update(cref("sales", s.id), { ...by, history: arrayUnion({ at: Date.now(), by: uid, n: who(), a: "cancel" }) });
  if (old > 0 && s.receiptId) b.update(cref("receipts", s.receiptId), by);
  if (s.customerId) b.update(cref("customers", s.customerId), { balance: increment(r2(-(s.due - old))) });
  b.set(cref("days", s.date), { salesTotal: increment(-s.total), cashSales: increment(-s.cash), receipts: increment(-old) }, { merge: true });
  b.commit().catch(fail);
}
function cancelReceipt(r) {
  if (!r || r.status !== "active" || !confirm(t("confirm_cancel"))) return;
  if (!canWrite()) return toast(t("e_perm"));
  const b = writeBatch(db);
  b.update(cref("receipts", r.id), { status: "cancelled", cancelledAt: serverTimestamp(), cancelledBy: S.uid, cancelledByName: who() });
  b.update(cref("customers", r.customerId), { balance: increment(r.amount) });
  b.set(cref("days", r.date), { receipts: increment(-r.amount) }, { merge: true });
  b.commit().catch(fail);
}

// ---------- কাস্টমার ----------
function drawCust() {
  show(`<div id="bn"></div><div class="card"><h1>${t("cust_title")}</h1>
  <div class="row"><span>${t("total_due")}</span><b class="neg" id="td2"></b></div>
  <input id="cs" placeholder="${t("search_cust")}" autocomplete="off" style="margin-top:8px">
  <button class="btn sm" id="ac" style="width:100%;margin-top:10px">${t("new_cust")}</button></div><div class="card" id="cl2"></div>`, navHtml(OT, "cust"));
  $("#cs").oninput = fillCustList; $("#ac").onclick = () => custSheet(null); fillCustList(); fillTop();
}
function fillCustList() {
  const l = $("#cl2"); if (!l) return;
  const q = ($("#cs").value || "").trim().toLowerCase();
  $("#td2").textContent = "৳ " + n(r2(S.cust.reduce((a, c) => a + (c.balance > 0 ? c.balance : 0), 0)));
  const a = S.cust.filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || "").includes(norm(q))).sort(byName);
  l.innerHTML = a.length ? a.map(c => `<div class="row" data-id="${c.id}" style="cursor:pointer"><div><b>${esc(c.name)}</b><div class="tag">${esc(c.phone || "")}</div></div>
  <div style="text-align:right"><b class="${c.balance > 0 ? "neg" : c.balance < 0 ? "pos" : ""}">৳ ${n(Math.abs(c.balance))}</b><div class="tag">${c.balance > 0 ? t("will_get") : c.balance < 0 ? t("adv") : ""}</div></div></div>`).join("") : `<div class="tag">${t("none_cust")}</div>`;
  l.querySelectorAll(".row").forEach(r => r.onclick = () => { S.ledger = r.dataset.id; draw(); });
}
function custSheet(c, onDone) {
  const o = sheet(`<b>${t(c ? "edit" : "new_cust")}</b><label>${t("name")}</label><input id="cn" value="${esc(c?.name)}">
  <label>${t("phone")}${t("opt")}</label><input id="cp" inputmode="tel" value="${esc(c?.phone)}">
  <label>${t("limit_opt")}</label><input id="cl3" inputmode="decimal" value="${c && c.creditLimit ? c.creditLimit : ""}">
  ${c ? "" : `<label>${t("opening")}</label><input id="co" inputmode="decimal">`}
  <div class="msg" id="cm"></div><button class="btn" id="cs3">${t("save")}</button>`);
  const q = s => o.querySelector(s); q("#cn").focus();
  q("#cs3").onclick = () => {
    const name = q("#cn").value.trim(), phone = q("#cp").value.trim(), lv = q("#cl3").value.trim(), ov = q("#co") ? q("#co").value.trim() : "";
    if (!name) return q("#cm").textContent = t("bad_name");
    const lim = lv ? calc(lv) : 0, op = ov ? calc(ov) : 0;
    if (isNaN(lim) || isNaN(op) || lim < 0 || op < 0) return q("#cm").textContent = t("bad_amt");
    if (!canWrite()) return q("#cm").textContent = t("e_perm");
    let id;
    if (c) { id = c.id; updateDoc(cref("customers", id), { name, phone, creditLimit: r2(lim) }).catch(fail); }
    else { const r = newRef("customers"); id = r.id; setDoc(r, { name, phone, creditLimit: r2(lim), balance: r2(op), opening: r2(op), lastTxnDate: null, createdBy: S.uid, createdAt: serverTimestamp() }).catch(fail); }
    closeSheet(); onDone && onDone(id);
  };
}
function recvSheet(c) {
  const o = sheet(`<b>${t("receive")} — ${esc(c.name)}</b><div class="tag">${t("cur_due")}: ৳ ${n(c.balance)}</div>
  <label>${t("amount")}</label><input id="ra" inputmode="decimal" autocomplete="off" style="font-size:24px;text-align:center"><div class="msg" id="rm"></div><button class="btn" id="rs">${t("save")}</button>`);
  const q = s => o.querySelector(s); calcBind(q("#ra")); q("#ra").focus();
  q("#rs").onclick = () => {
    const a = r2(calc(q("#ra").value)); if (!(a > 0)) return q("#rm").textContent = t("bad_amt");
    if (!canWrite()) return q("#rm").textContent = t("e_perm");
    const date = todayStr(), b = writeBatch(db);
    b.set(newRef("receipts"), { customerId: c.id, customerName: c.name, amount: a, date, status: "active", createdBy: S.uid, createdAt: serverTimestamp() });
    b.update(cref("customers", c.id), { balance: increment(-a), lastTxnDate: date });
    b.set(cref("days", date), { receipts: increment(a) }, { merge: true });
    b.commit().catch(fail); closeSheet(); toast(t("rec_saved", { a: n(a) }));
  };
}

// ---------- কাস্টমারের খাতা ----------
function stopLedger() { S.unL1 && S.unL1(); S.unL2 && S.unL2(); S.unL1 = S.unL2 = null; }
function drawLedger() {
  const c = S.cust.find(x => x.id === S.ledger); if (!c) { S.ledger = null; return draw(); }
  show(`<button class="link" id="bk" style="text-align:left;width:auto;padding:0 0 10px">← ${t("back")}</button>
  <div class="card"><h1>${esc(c.name)}</h1><div class="tag">${esc(c.phone || "")}</div><div class="big" id="lb"></div><div class="tag" id="li" style="text-align:center;margin-bottom:10px"></div>
  <div style="display:flex;gap:8px"><button class="btn sm" style="flex:1;margin:0" id="lr">${t("receive")}</button><button class="btn ghost sm" style="flex:1;margin:0" id="ls">${t("do_sale")}</button></div>
  <div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost sm" style="flex:1;margin:0" id="le">${t("edit")}</button><button class="btn ghost sm" style="flex:1;margin:0" id="lv">${t("reconcile")}</button></div></div>
  <div class="card" id="lt"></div>`, navHtml(OT, "cust"));
  const cur = () => S.cust.find(x => x.id === S.ledger);
  $("#bk").onclick = () => { stopLedger(); S.ledger = null; draw(); };
  $("#lr").onclick = () => recvSheet(cur()); $("#le").onclick = () => custSheet(cur());
  $("#ls").onclick = () => { stopLedger(); S.mode = "cust"; S.sel = S.ledger; S.ledger = null; S.tab = "sale"; draw(); };
  $("#lv").onclick = () => reconcile(cur());
  stopLedger(); S.led = { s: [], r: [] };
  const q = c2 => query(collection(db, "clients", S.uid, c2), where("customerId", "==", c.id));
  S.unL1 = onSnapshot(q("sales"), x => { S.led.s = x.docs.map(d => ({ id: d.id, ...d.data() })); fillLedger(); }, fail);
  S.unL2 = onSnapshot(q("receipts"), x => { S.led.r = x.docs.map(d => ({ id: d.id, ...d.data() })); fillLedger(); }, fail);
  fillLedger();
}
function fillLedger() {
  const c = S.cust.find(x => x.id === S.ledger); if (!c || !$("#lb")) return;
  $("#lb").innerHTML = `<span class="${c.balance > 0 ? "neg" : "pos"}">৳ ${n(Math.abs(c.balance))}</span><div class="tag">${c.balance > 0 ? t("will_get") : c.balance < 0 ? t("adv") : ""}</div>`;
  $("#li").textContent = [c.lastTxnDate ? t("last_txn") + ": " + fmtD(c.lastTxnDate) : "", c.creditLimit > 0 ? t("limit") + ": ৳ " + n(c.creditLimit) : ""].filter(Boolean).join(" · ");
  const rows = [...S.led.s.map(x => ({ k: "s", x })), ...S.led.r.map(x => ({ k: "r", x }))].sort((a, b) => b.x.date.localeCompare(a.x.date) || ms(b.x) - ms(a.x));
  $("#lt").innerHTML = rows.length ? rows.map(({ k, x }) => {
    const dead = x.status === "cancelled", canC = !dead && !(k === "r" && x.fromSaleId);
    const right = k === "s" ? (x.due > 0 ? `<b class="neg">+${n(x.due)}</b>` : `<b>${n(x.total)}</b>`) : `<b class="pos">−${n(x.amount)}</b>`;
    const lbl = k === "s" ? (x.due > 0 ? `${t("sale_credit")} ৳${n(x.total)} · ${t("cash_got").replace(" (৳)", "")} ${n(x.cash)}` : `${t("sale_cash")} ৳${n(x.total)}`) : t("collected");
    return `<div class="row" style="align-items:flex-start"><div style="flex:1"><div class="${dead ? "x" : ""}">${lbl}${x.note ? `<div class="tag">📝 ${esc(x.note)}</div>` : ""}</div>
    <div class="tag">${fmtD(x.date)}${x.editedByName ? ` · ✎ ${t("edited_by")}${esc(x.editedByName)}` : ""}</div>${dead ? `<div class="tag neg">${t("cancel_by")}${esc(x.cancelledByName || "")}</div>` : ""}</div>
    <div style="text-align:right"><span class="${dead ? "x" : ""}">${right}</span>${dead ? "" : `<div>${k === "s" ? `<button class="ib" data-a="e" data-k="${k}" data-id="${x.id}">✎</button>` : ""}${canC ? `<button class="ib" data-a="c" data-k="${k}" data-id="${x.id}" style="color:var(--red)">${t("cancel")}</button>` : ""}</div>`}</div></div>`;
  }).join("") : `<div class="tag">${t("no_entries")}</div>`;
  $("#lt").querySelectorAll("[data-id]").forEach(b => b.onclick = () => {
    const sale = b.dataset.k === "s", item = (sale ? S.led.s : S.led.r).find(z => z.id === b.dataset.id);
    if (b.dataset.a === "e") editSale(item); else sale ? cancelSale(item) : cancelReceipt(item);
  });
}
function reconcile(c) {
  const act = a => a.filter(x => x.status === "active");
  const sum = r2((c.opening || 0) + act(S.led.s).reduce((a, x) => a + x.due, 0) - act(S.led.r).reduce((a, x) => a + x.amount, 0));
  if (Math.abs(sum - c.balance) < 0.005) return toast(t("rec_ok"));
  updateDoc(cref("customers", c.id), { balance: sum }).then(() => toast(t("rec_fixed"))).catch(fail);
}

// ---------- সেটিংস (সংক্ষিপ্ত সারি, এডিট চাপলে তবেই খোলে) ----------
const srow = (lbl, val, key) => `<div class="srow"><span>${lbl}</span><b>${val}</b>${key ? `<button class="ib" data-ed="${key}">✎</button>` : ""}</div>`;
function fieldSheet(title, val, save, mode) {
  const o = sheet(`<b>${title}</b><input id="fv" ${mode ? `inputmode="${mode}"` : ""} value="${esc(val)}" style="margin-top:10px"><div class="msg" id="fm"></div><button class="btn" id="fs" style="margin-top:6px">${t("save")}</button>`);
  const i = o.querySelector("#fv"); i.focus();
  o.querySelector("#fs").onclick = async () => {
    try { const r = await save(i.value.trim()); if (r) { o.querySelector("#fm").textContent = r; return; } closeSheet(); } catch (e) { o.querySelector("#fm").textContent = errMsg(e); }
  };
}
function pickSheet(kind) {
  const opts = kind === "lang" ? [["bn", "বাংলা"], ["en", "English"]] : [["bn", "০১২৩"], ["en", "0123"]], cur = kind === "lang" ? P.lang : P.dig;
  const o = sheet(`<b>${t(kind === "lang" ? "lang" : "digits")}</b><div class="seg">${opts.map(([v, l]) => `<button data-v="${v}" class="${v === cur ? "on" : ""}">${l}</button>`).join("")}</div>`);
  o.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    if (kind === "lang") { P.lang = b.dataset.v; LS.s("lang", P.lang); } else { P.dig = b.dataset.v; LS.s("dig", P.dig); }
    closeSheet(); rerender();
  });
}
function pwSheet() {
  const o = sheet(`<b>${t("pw_chg")}</b><label>${t("pw_cur")}</label><input id="p1" type="password" autocomplete="current-password">
  <label>${t("pw_new")}</label><input id="p2" type="password" autocomplete="new-password"><label>${t("pw_new2")}</label><input id="p3" type="password" autocomplete="new-password">
  <div class="msg" id="pm2"></div><button class="btn" id="ps" style="margin-top:6px">${t("save")}</button>`);
  const q = x => o.querySelector(x);
  q("#ps").onclick = async () => {
    const a = q("#p1").value, b = q("#p2").value;
    if (b.length < 6) return q("#pm2").textContent = t("e_weak");
    if (b !== q("#p3").value) return q("#pm2").textContent = t("pw_mis");
    try { const u = auth.currentUser; await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, a)); await updatePassword(u, b); closeSheet(); toast(t("pw_done")); }
    catch (e) { q("#pm2").textContent = errMsg(e); }
  };
}
const commonRows = () => srow(t("lang"), P.lang === "en" ? "English" : "বাংলা", "lang") + srow(t("digits"), P.dig === "bn" ? "০১২৩" : "0123", "dig") + srow(t("pw_chg"), "••••••", "pw");
function bindEd(extra) {
  document.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => {
    const k = b.dataset.ed;
    if (k === "lang" || k === "dig") return pickSheet(k);
    if (k === "pw") return pwSheet();
    extra(k);
  });
}
function drawSet() {
  const c = S.client, s = S.sub;
  const upd = (key, req) => v => { if (req && !v) return t("bad_name"); updateDoc(doc(db, "clients", S.uid), { [key]: v }).then(() => toast(t("saved"))).catch(fail); };
  show(`<div class="card">${head()}${srow(t("status"), statusBadge(s))}${srow(t("plan") + " / " + t("mode"), s ? esc(s.plan + " / " + s.mode) : "—")}${srow(t("expiry"), s ? fmtDate(s.expiresAt) : "—")}</div>
  <div class="card"><div class="sh2">${t("prof_t")}</div>${srow(t("shop"), esc(c.shopName), "shop")}${srow(t("owner"), esc(c.ownerName), "owner")}${srow(t("phone"), esc(c.phone) || "—", "phone")}</div>
  <div class="card"><div class="sh2">${t("app_t")}</div>${commonRows()}</div>
  <button class="btn ghost sm" id="lo" style="width:100%">${t("logout")}</button>`, navHtml(OT, "set"));
  bindEd(k => {
    if (k === "shop") fieldSheet(t("shop"), c.shopName, upd("shopName", 1));
    if (k === "owner") fieldSheet(t("owner"), c.ownerName, upd("ownerName", 1));
    if (k === "phone") fieldSheet(t("phone") + t("opt"), c.phone || "", upd("phone"), "tel");
  });
}

// ================= অ্যাডমিন =================
function viewAdmin() {
  A = { tab: "clients", c: [], s: {}, trial: DEFAULT_TRIAL_DAYS };
  const onErr = e => show(`<div class="card"><div class="msg">${esc(errMsg(e))}</div><button class="btn ghost" id="lo">${t("logout")}</button></div>`);
  const redraw = () => { if (A.tab === "clients") drawAdmin(); };
  unsubs.push(onSnapshot(collection(db, "clients"), q => { A.c = q.docs.map(d => ({ id: d.id, ...d.data() })); redraw(); }, onErr));
  unsubs.push(onSnapshot(collection(db, "subscriptions"), q => { A.s = {}; q.docs.forEach(d => A.s[d.id] = d.data()); redraw(); }, onErr));
  unsubs.push(onSnapshot(doc(db, "config", "app"), d => { A.trial = d.exists() && Number.isInteger(d.data().trialDays) ? d.data().trialDays : DEFAULT_TRIAL_DAYS; if (A.tab === "set") drawAdmin(); }, onErr));
  drawAdmin();
}
function drawAdmin() {
  const nv = navHtml(AT, A.tab);
  if (A.tab === "clients") {
    show(`<div class="card"><h1>${t("tab_clients")}</h1><div class="brand">Quick Hisab by FaBi Hub · ${t("clients_n", { n: n(A.c.length) })}</div>
    ${A.c.map(x => { const s = A.s[x.id]; return `<div class="row" data-id="${x.id}" style="cursor:pointer"><div><b>${esc(x.shopName)}</b><div class="tag">${contact(x)}</div></div>
    <div style="text-align:right">${statusBadge(s)}<div class="tag">${s ? esc(s.plan) + " / " + esc(s.mode) + " · " + fmtDate(s.expiresAt) : ""}</div></div></div>`; }).join("") || `<div class="tag">${t("no_clients")}</div>`}</div>`, nv);
    $("#main").querySelectorAll(".row[data-id]").forEach(r => r.onclick = () => subSheet(r.dataset.id));
    return;
  }
  show(`<div class="card"><h1>${t("tab_set")}</h1><div class="brand">Quick Hisab by FaBi Hub</div>
  ${srow(t("trial_s"), dg(A.trial) + " " + t("dayu"), "trial")}<div class="tag" style="margin:-2px 0 8px">${t("trial_note")}</div>${commonRows()}</div>
  <button class="btn ghost sm" id="lo" style="width:100%">${t("logout")}</button>`, nv);
  bindEd(k => {
    if (k === "trial") fieldSheet(t("trial_lbl"), A.trial, async v => {
      const x = Number(norm(v)); if (v === "" || !Number.isInteger(x) || x < 0 || x > 365) return t("trial_bad");
      await setDoc(doc(db, "config", "app"), { trialDays: x }, { merge: true }); toast(t("saved"));
    }, "numeric");
  });
}
// ক্লায়েন্টের মেয়াদ বদল: পাসওয়ার্ড লাগে, কমালে সতর্কতা
function subSheet(id) {
  const x = A.c.find(c => c.id === id), s = A.s[id]; if (!x) return;
  const cur = s ? s.expiresAt.toDate() : new Date();
  const o = sheet(`<b>${esc(x.shopName)}</b><div class="tag">${contact(x)}</div>
  <div class="row"><span>${t("cur_exp")}</span><b>${s ? fmtDate(s.expiresAt) : "—"}</b></div>
  <label>${t("new_exp")}</label><input type="date" id="ne" value="${dstr(cur)}">
  <div class="seg"><button data-add="30">${t("plus30")}</button><button data-add="365">${t("plus365")}</button></div>
  <div class="msg" id="nm"></div><button class="btn" id="ns" style="margin-top:6px">${t("save")}</button>`);
  const q = z => o.querySelector(z);
  o.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const d = new Date(Math.max(Date.now(), cur.getTime())); d.setDate(d.getDate() + +b.dataset.add); q("#ne").value = dstr(d); });
  q("#ns").onclick = async () => {
    if (!s) return q("#nm").textContent = t("b_none");
    const v = q("#ne").value, nd = new Date(v + "T23:59:59"); if (!v || isNaN(nd)) return q("#nm").textContent = t("bad_date");
    if (nd < cur && !confirm(t("warn_reduce", { a: fmtDate(s.expiresAt), b: fmtD(v), d: n(Math.ceil((cur - nd) / 864e5)) }))) return;
    if (!(await askPassword())) return;
    updateDoc(doc(db, "subscriptions", id), { expiresAt: Timestamp.fromDate(nd) }).then(() => toast(t("exp_saved"))).catch(fail);
  };
}

// ================= রোল দেখে রাউটিং =================
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = []; ROLE = null;
  if (!u) { viewAuth(); return; }
  show(loadingH());
  if (u.uid === ADMIN_UID) { ROLE = "admin"; viewAdmin(); } else { ROLE = "owner"; viewOwner(u); }
});
