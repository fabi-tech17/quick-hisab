// ছবি-ভিত্তিক PDF (ব্রাউজার নিজে বাংলা আঁকে), সারির সীমানায় পেজ ভাঙে
async function pdfReport(R) {
  await loadJs("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-9999px;top:0;width:720px;background:#fff;color:#000;padding:24px;font-family:'Hind Siliguri',sans-serif";
  box.innerHTML = reportHtml(R); document.body.appendChild(box);
  const top = box.getBoundingClientRect().top, br = [...box.querySelectorAll("tr, h3, h4")].map(z => (z.getBoundingClientRect().bottom - top) * 2);
  const cv = await window.html2canvas(box, { scale: 2, backgroundColor: "#fff" }); box.remove();
  const pdf = new window.jspdf.jsPDF("p", "pt", "a4"), W = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight() * cv.width / W;
  let off = 0, first = true;
  while (off < cv.height - 1) {
    let end = Math.min(off + pageH, cv.height);
    if (end < cv.height) { const c = br.filter(v => v > off + pageH * .5 && v <= end); if (c.length) end = Math.max(...c); }
    const part = document.createElement("canvas"); part.width = cv.width; part.height = Math.round(end - off);
    part.getContext("2d").drawImage(cv, 0, off, cv.width, part.height, 0, 0, cv.width, part.height);
    if (!first) pdf.addPage(); first = false;
    pdf.addImage(part.toDataURL("image/jpeg", .92), "JPEG", 0, 0, W, part.height * W / cv.width); off = end;
  }
  pdf.save(R.file + ".pdf");
}

    { head: t("rs_head"), cols: [t("r_item"), t("r_cnt"), t("r_amt")], rows: offs, foot: [t("r_total"), items.length, sm(() => true)] },
    { head: t("inc_day"), cols: [t("r_date"), t("r_cnt"), t("r_amt")], rows: days },
    { head: t("rx_det"), cols: [t("r_date"), t("c_name"), t("bill_offer"), t("c_meth"), "TrxID", t("r_amt")], rows }] };
}
function drawInc() {
  show(`<div class="card"><h1>${t("inc_title")}</h1>${rangeHtml(A.ia || monthStart(), A.ib || todayStr())}
  <div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm" id="pdf" style="flex:1;margin:0">PDF</button><button class="btn ghost sm" id="csv" style="flex:1;margin:0">Excel</button></div></div><div class="card" id="rp"></div>`, navHtml(AT, "inc"));
  bindRange((x, y) => { A.ia = x; A.ib = y; }, loadInc);
  $("#csv").onclick = () => A.R && csvReport(A.R); $("#pdf").onclick = () => { if (!A.R) return; toast(t("rep_make"), 8000); pdfReport(A.R).catch(fail); };
  loadInc();
}
async function loadInc() {
  const box = $("#rp"); if (!box) return; box.innerHTML = `<div class="tag">${t("loading")}</div>`;
  const a = A.ia || monthStart(), b = A.ib || todayStr();
  try {
    const items = (await getDocs(query(collection(db, "payments"), where("date", ">=", a), where("date", "<=", b)))).docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.status === "approved");
    const R = buildIncome(a, b, items); if (!$("#rp")) return; A.R = R; box.innerHTML = reportHtml(R);
  } catch (e) { box.innerHTML = `<div class="msg">${esc(errMsg(e))}</div>`; }
}

// ================= রোল দেখে রাউটিং =================
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = []; ROLE = null;
  if (!u) { viewAuth(); return; }
  show(loadingH());
  if (u.uid === ADMIN_UID) { ROLE = "admin"; viewAdmin(); } else { ROLE = "owner"; viewOwner(u); }
});
